name: Build macOS 15
on:
  workflow_dispatch:  # 手动触发

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.3.app/Contents/Developer

      - name: Show versions
        run: |
          xcodebuild -version
          xcodebuild -showBuildSettings | grep SWIFT_VERSION
          swift --version

      - name: Build whisper.cpp framework
        run: make setup

      - name: Build VoiceInk (local, no cert)
        run: make local

      - name: Package .app bundle
        run: |
          # 打包成 tar.gz，保留 macOS bundle 权限和结构
          cd ~/Downloads
          tar czvf $GITHUB_WORKSPACE/VoiceInk.app.tar.gz VoiceInk.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoiceInk-app
          path: ${{ github.workspace }}/VoiceInk.app.tar.gz
          retention-days: 30
