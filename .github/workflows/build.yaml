name: Build macos-15

on:
  workflow_dispatch:  # 手动触发，或改成 push/pull_request

jobs:
  build:
    runs-on: macos-15  # 或 macos-15-large（付费，更快）

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.3.app/Contents/Developer

      - name: Show versions
        run: |
          xcodebuild -version
          xcodebuild -showBuildSettings | grep SWIFT_VERSION
          swift --version 

      - name: Build whisper.cpp framework
        run: make setup
      - name: Build VoiceInk (local, no cert)
        run: make local
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoiceInk-app
          path: ~/Downloads/VoiceInk.app
          retention-days: 7

